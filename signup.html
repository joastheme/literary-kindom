<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="loginandsignup.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarice Club</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html"><img src="assets/images/logo.png" alt=""></a>
            <div class="line links">
                <h2><a href="about.html">SOBRE</a></h2>
                <h2><a href="login.html">LOGIN</a></h2>
                <h2><a href="signup.html">SIGNUP</a></h2>
                <h2><a id="logout" href="">LOGOUT</a></h2>
            </div>
        </nav>
    </header>

    <main class="line">
        <section class="column">
            <h1>Sign Up</h1>
            <form class="column">
                <label for="username">Username:</label>
                <input type="text" name="username" id="username">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
                <label for="password">Senha:</label>
                <input type="password" name="password" id="password">
                <button type="submit">Enviar</button>
            </form>
            <p id="success"></p>
            <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
        </section>
    </main>

    <script type="module" src="signup.js"></script>
    <script type="module" src="script.js"></script>
</body>
